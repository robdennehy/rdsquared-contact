<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RD Squared Contact Form</title>

<style>

:root{
    --cyan:#00E5FF;
    --magenta:#FF00FF;
    --background:#000000;
    --card:#111111;
    --white:#FFFFFF;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:var(--background);
    font-family:Arial, Helvetica, sans-serif;
    color:var(--white);
    min-height:100vh;
    padding:40px 20px;
}

.container{
    max-width:700px;
    margin:auto;
}

.form-card{
    background:var(--card);
    border-radius:16px;
    padding:30px;
    border:1px solid rgba(0,229,255,.3);
    box-shadow:
        0 0 15px rgba(0,229,255,.25),
        0 0 30px rgba(255,0,255,.15);
}

h1{
    text-align:center;
    color:var(--cyan);
    margin-bottom:25px;
    text-shadow:0 0 8px rgba(0,229,255,.8);
}

label{
    display:block;
    margin-bottom:8px;
    color:var(--cyan);
    font-weight:bold;
}

input,
textarea{
    width:100%;
    padding:14px;
    margin-bottom:20px;
    border-radius:8px;
    border:1px solid #333;
    background:#0a0a0a;
    color:white;
    font-size:15px;
}

input:focus,
textarea:focus{
    outline:none;
    border-color:var(--magenta);
    box-shadow:0 0 10px rgba(255,0,255,.6);
}

textarea{
    min-height:150px;
    resize:vertical;
}

button{
    width:100%;
    padding:16px;
    border:none;
    border-radius:8px;
    font-weight:bold;
    font-size:16px;
    cursor:pointer;
    background:linear-gradient(
        90deg,
        var(--cyan),
        var(--magenta)
    );
    color:black;
    transition:0.3s;
}

button:hover{
    box-shadow:
        0 0 15px rgba(0,229,255,.7),
        0 0 20px rgba(255,0,255,.7);
    transform:translateY(-2px);
}

.success{
    display:none;
    margin-bottom:20px;
    padding:15px;
    border-radius:8px;
    background:#111;
    border:1px solid var(--cyan);
    text-align:center;
}

.show{
    display:block;
}

</style>
</head>

<body>

<div class="container">

    <div id="successMessage" class="success">
        ✅ Thank you for contacting us. Your enquiry has been sent successfully.
    </div>

    <div class="form-card">

        <h1>Contact Us</h1>

        https://formsubmit.co/hello@rdsquared.co.uk

            <input type="hidden" name="_subject" value="New RD Squared Enquiry">
            <input type="hidden" name="_captcha" value="false">
            <input type="hidden" name="_template" value="table">

            <input
                type="hidden"
                name="_next"
                value="https://robdennehy.github.io/rdsquared-contact/?success=true">

            <label>Name</label>
            <input
                type="text"
                name="Name"
                placeholder="Your name"
                required>

            <label>Email Address</label>
            <input
                type="email"
                name="Email"
                placeholder="you@example.com"
                required>

            <label>Phone Number</label>
            <input
                type="tel"
                name="Phone Number"
                placeholder="Optional">

            <label>Message</label>
            <textarea
                name="Message"
                placeholder="Tell us how we can help..."
                required></textarea>

            <button type="submit">
                SEND ENQUIRY
            </button>

        </form>

    </div>

</div>

<script>
const params = new URLSearchParams(window.location.search);

if(params.get("success") === "true"){
    document
        .getElementById("successMessage")
        .classList.add("show");
}
</script>

</body>
</html>
