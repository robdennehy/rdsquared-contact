<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RD Squared Contact Form</title>

    <style>
        :root {
            --cyan: #00E5FF;
            --magenta: #FF00FF;
            --background: transparent;
            --card: #111111;
            --white: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            background: transparent;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            color: var(--white);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: auto;
        }

        .form-card {
            background: var(--card);
            border-radius: 16px;
            padding: 30px;
            border: 1px solid rgba(0, 229, 255, 0.3);
            box-shadow:
                0 0 15px rgba(0, 229, 255, 0.25),
                0 0 30px rgba(255, 0, 255, 0.15);
        }

        h1 {
            text-align: center;
            color: var(--cyan);
            margin-bottom: 25px;
            text-shadow: 0 0 8px rgba(0, 229, 255, 0.8);
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--cyan);
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #0a0a0a;
            color: white;
            font-size: 15px;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: var(--magenta);
            box-shadow: 0 0 10px rgba(255, 0, 255, 0.6);
        }

        textarea {
            min-height: 150px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            background: linear-gradient(
                90deg,
                var(--cyan),
                var(--magenta)
            );
            color: black;
            transition: 0.3s;
        }

        button:hover:not(:disabled) {
            box-shadow:
                0 0 15px rgba(0, 229, 255, 0.7),
                0 0 20px rgba(255, 0, 255, 0.7);
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .success-box {
            display: none;
            text-align: center;
            padding: 40px 15px;
        }

        .success-box.show {
            display: block;
        }

        .success-box .icon {
            font-size: 50px;
            margin-bottom: 16px;
            display: block;
        }

        .success-box h2 {
            color: var(--cyan);
            font-size: 26px;
            margin-bottom: 12px;
            text-shadow: 0 0 8px rgba(0, 229, 255, 0.8);
        }

        .success-box p {
            color: var(--white);
            font-size: 16px;
            line-height: 1.5;
            opacity: 0.9;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="form-card">

        <!-- Form View -->
        <div id="formWrapper">
            <h1>Contact Us</h1>

            <form id="contactForm">
                <!-- FormSubmit Configuration -->
                <input type="hidden" name="_subject" value="New RD Squared Enquiry">
                <input type="hidden" name="_captcha" value="false">
                <input type="hidden" name="_template" value="table">

                <!-- Honeypot Spam Filter -->
                <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">

                <label for="name">Name</label>
                <input
                    id="name"
                    type="text"
                    name="Name"
                    placeholder="Your name"
                    required>

                <label for="email">Email Address</label>
                <input
                    id="email"
                    type="email"
                    name="Email"
                    placeholder="you@example.com"
                    required>

                <label for="phone">Phone Number</label>
                <input
                    id="phone"
                    type="tel"
                    name="Phone Number"
                    placeholder="Optional">

                <label for="message">Message</label>
                <textarea
                    id="message"
                    name="Message"
                    placeholder="Tell us how we can help..."
                    required></textarea>

                <button type="submit" id="submitBtn">
                    SEND ENQUIRY
                </button>
            </form>
        </div>

        <!-- In-Place Success View -->
        <div id="successBox" class="success-box">
            <span class="icon">✅</span>
            <h2>Thank You!</h2>
            <p>Your enquiry has been sent successfully.<br>We will be in touch shortly.</p>
        </div>

    </div>

</div>

<script>
    const form = document.getElementById("contactForm");
    const formWrapper = document.getElementById("formWrapper");
    const successBox = document.getElementById("successBox");
    const submitBtn = document.getElementById("submitBtn");

    form.addEventListener("submit", async function (e) {
        e.preventDefault();

        submitBtn.disabled = true;
        submitBtn.textContent = "SENDING...";

        const formData = new FormData(form);
        const data = Object.fromEntries(formData.entries());

        try {
            const response = await fetch("https://formsubmit.co/ajax/hello@rdsquared.co.uk", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Accept": "application/json"
                },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                formWrapper.style.display = "none";
                successBox.classList.add("show");
            } else {
                alert("Something went wrong. Please check your submission and try again.");
                submitBtn.disabled = false;
                submitBtn.textContent = "SEND ENQUIRY";
            }
        } catch (error) {
            alert("A network error occurred. Please try again.");
            submitBtn.disabled = false;
            submitBtn.textContent = "SEND ENQUIRY";
        }
    });
</script>

</body>
</html>
